<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사랑하는 준 형에게 💌</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thêm font chữ tiếng Hàn dễ thương -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Gowun Dodum', 'Nunito', sans-serif; /* Sử dụng font tiếng Hàn */
            overflow: hidden; 
            background: linear-gradient(135deg, #ffe4e6 0%, #fbcfe8 100%); 
            height: 100vh;
            width: 100vw;
            margin: 0;
            touch-action: none; 
        }

        #hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 10;
        }

        @keyframes fallDown {
            0% {
                transform: translateY(-10vh) scale(0.8) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) scale(1.2) rotate(360deg);
                opacity: 0.5;
            }
        }

        .falling-heart {
            position: absolute;
            top: -10vh;
            animation: fallDown linear forwards;
            filter: drop-shadow(0 2px 4px rgba(255, 105, 180, 0.4));
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .heartbeat-icon {
            animation: heartbeat 1s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <!-- Màn hình 1: Nhận thông điệp -->
    <div id="screen-1" class="relative z-20 bg-white/60 backdrop-blur-md p-10 md:p-16 rounded-[3rem] shadow-2xl text-center border border-white/50 w-[90%] max-w-lg transition-opacity duration-500">
        <div class="text-6xl mb-6 heartbeat-icon inline-block">💌</div>
        <h1 class="text-3xl md:text-4xl text-rose-500 font-bold mb-4 drop-shadow-sm leading-tight">
            메시지가 도착했습니다!
        </h1>
        <p class="text-lg text-rose-400 font-semibold mb-10">(당신에게 온 메시지가 있습니다.)</p>
        
        <div class="flex justify-center items-center">
            <button id="btn-open" class="bg-gradient-to-r from-rose-400 to-pink-500 text-white font-bold text-xl py-3 px-8 rounded-full shadow-lg hover:scale-105 hover:shadow-pink-400/50 transition-all duration-300 w-auto z-30 whitespace-nowrap">
                메시지 열어보기 🔓
            </button>
        </div>
    </div>

    <!-- Màn hình 2: Nội dung thông điệp -->
    <div id="screen-2" class="hidden absolute z-20 bg-white/70 backdrop-blur-md p-10 md:p-14 rounded-[3rem] shadow-2xl text-center border border-white/50 w-[90%] max-w-lg scale-90 opacity-0 transition-all duration-700">
        <div class="text-6xl mb-6 heartbeat-icon inline-block">🥰</div>
        <h1 class="text-3xl md:text-4xl text-rose-600 font-bold mb-6 drop-shadow-sm">
            김준 형!
        </h1>
        <p class="text-xl md:text-2xl font-bold text-gray-700 leading-relaxed mb-4">
            지금은 제가 너무 바빠서요 ㅠㅠ <br>
            바쁜 일이 다 끝나면 <br>
            우리 같이 시간 보내요! ❤️
        </p>
    </div>

    <!-- Container chứa hiệu ứng trái tim rơi -->
    <div id="hearts-container"></div>

    <script>
        const btnOpen = document.getElementById('btn-open');
        const screen1 = document.getElementById('screen-1');
        const screen2 = document.getElementById('screen-2');
        const heartsContainer = document.getElementById('hearts-container');

        // Hàm tạo một trái tim rơi
        function createFallingHeart() {
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            
            const heartSymbols = ['❤️', '💖', '💗', '💓', '💘', '💕', '💞', '🌸'];
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            
            heart.style.left = `${Math.random() * 100}vw`;
            
            const duration = Math.random() * 3 + 3; // 3 - 6 giây
            heart.style.animationDuration = `${duration}s`;
            heart.style.fontSize = `${Math.random() * 20 + 20}px`; // 20px - 40px
            
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Xử lý sự kiện khi ấn nút "Mở thông điệp"
        btnOpen.addEventListener('click', () => {
            // 1. Ẩn màn hình 1 
            screen1.classList.add('opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                screen1.style.display = 'none'; 
                
                // 2. Hiện màn hình 2
                screen2.classList.remove('hidden');
                
                setTimeout(() => {
                    screen2.classList.remove('opacity-0', 'scale-90');
                    screen2.classList.add('opacity-100', 'scale-100');
                }, 50);

                // 3. Khởi tạo hiệu ứng mưa trái tim
                for(let i = 0; i < 15; i++) {
                    setTimeout(createFallingHeart, i * 150);
                }
                
                setInterval(createFallingHeart, 400);

            }, 500); 
        });
    </script>
</body>
</html>
